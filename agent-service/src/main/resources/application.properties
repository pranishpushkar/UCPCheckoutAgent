# agent-service (C9, C10). Settings come from the environment through ServiceProperties, not from here.
spring.application.name=agent-service
spring.main.banner-mode=off
# Risk 9: no Whitelabel page, no stack trace, message or exception class in any error body. ApiErrors renders errors.
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
# Static resources only under /static (none yet), so an unknown /api route is a plain 404 from ApiErrors.
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false
server.shutdown=graceful
# Logging (C16, I8, m6-plan section 10): JSON lines on stdout through Boot's structured logging; the customiser masks
# every string of every event. Spring Boot 4.1: https://docs.spring.io/spring-boot/reference/features/logging.html
logging.structured.format.console=ecs
logging.structured.json.customizer=dev.ucplab.service.logging.RedactingLogCustomizer
# The request log is our own filter (RequestLogFilter): no access log, and no request details from Spring MVC.
server.tomcat.accesslog.enabled=false
spring.mvc.log-request-details=false
