# H3 P10 (ADR 0009): the mutation passes, one job each, then the report. MANUAL ONLY: workflow_dispatch, never on a pull request
# or a push (the orchestrator pass alone is about 15 minutes of CPU at 10,000 schedules, the whole set about 45). Read-only token,
# no secrets, no cache, nothing persisted after checkout. Every action is pinned by commit SHA (the tag is in the comment): the
# checkout, setup-java and upload-artifact SHAs are the ones interop.yml uses; download-artifact looked up the same way on
# 2026-11-15 with
#   gh api repos/actions/download-artifact/git/matching-refs/tags/v7
# The last job runs the report generator without PIT and fails when it fails: a star survivor with no approved entry, an entry
# without approval, a stale entry.
name: Mutation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.pass == 'core-orchestrator' && 120 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        pass: [core-policy, core-approval, core-merchant, core-json, core-intent, core-recovery, core-orchestrator, ucp, persistence]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09        # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961      # v5
        with:
          distribution: temurin
          java-version: '21'
          # No cache: nothing a job writes may be restored by another workflow.
      - name: Mutation pass
        run: scripts/mutation-pass.sh "${{ matrix.pass }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: ${{ matrix.pass }}
          path: target/mutation-runs/${{ matrix.pass }}
          if-no-files-found: ignore

  report:
    needs: pass
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09        # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961      # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          path: runs
      - name: Build the generator
        run: ./mvnw -B -ntp -q -pl eval-harness -am -DskipTests install
      - name: Generate the report (fails on a star survivor, an unapproved entry or a stale entry)
        run: >-
          java -cp "eval-harness/target/classes" dev.ucplab.eval.report.MutationReport
          runs docs/mutation/equivalents.md docs/mutation/star-classes.txt target/h3-mutation-report.md
          "$GITHUB_SHA" "$(./mvnw -q help:evaluate -Dexpression=pitest.version -DforceStdout)"
          "$(./mvnw -q help:evaluate -Dexpression=pitest-junit5-plugin.version -DforceStdout)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: h3-mutation-report
          path: target/h3-mutation-report.md
          if-no-files-found: ignore
