# Section 15. Every push runs ./mvnw verify: build, unit, property, component,
# contract and ArchUnit tests, and the reduced scripted evaluation (ScriptedEvaluationSmokeTest:
# 20 runs per scenario at time scale 4, S9 6 and S28 2, labelled REDUCED, in eval-harness/target/eval-reduced).
# The full evaluation (-Peval-full) is manual: .github/workflows/eval-full.yml (Decision 1).
# S9 and S28 assert exit value 137 after kill -9 and start child JVMs from surefire (m4-plan risks 1 and 3);
# both held on Linux in https://github.com/pranishpushkar/UCPCheckoutAgent/actions/runs/43337144864.
# The live evaluation (-Peval-live) is manual too: .github/workflows/eval-live.yml reads GEMINI_API_KEY from a
# repository secret (m5-plan section 10). No job here has the key; NoLiveInVerifyTest keeps live calls out of verify.
name: CI

on:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # CI speed: the persistence and eval-harness tests keep their temp files, the SQLite databases among them, in
      # /dev/shm (tmpfs) through -Dtest.tmpdir, so a commit's fsync costs nothing. Only where the files live changes.
      # Stop here, clearly, if /dev/shm is missing or too small.
      - name: Check /dev/shm
        run: |
          df -h /dev/shm
          free_kb=$(df -Pk /dev/shm | awk 'NR==2 {print $4}')
          if [ "${free_kb:-0}" -lt 2097152 ]; then
            echo "::error::/dev/shm has $(( ${free_kb:-0} / 1024 )) MiB free; the tests' temp files need at least 2048 MiB (-Dtest.tmpdir=/dev/shm)"
            exit 1
          fi
      # -T 1C: one build thread per core, so modules that do not depend on each other (merchant, fault-proxy, agent-ucp
      # beside agent-core and agent-persistence) build and test at the same time.
      - run: ./mvnw -B -ntp -T 1C -Dtest.tmpdir=/dev/shm verify
      - name: /dev/shm after the tests
        if: always()
        run: df -h /dev/shm
