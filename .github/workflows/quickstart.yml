# The README's quick start, proved from a clean checkout (m6-plan section 13, C20): steps 2 to 4 through
# scripts/quickstart.sh, the CLI smoke (steps 5 to 7) through scripts/quickstart-smoke.sh, the image layer scan
# (section 9.4), then `docker compose down -v`. The scripted model is used and no job has GEMINI_API_KEY: this job
# never makes a live model call.
# Triggers (Decisions item 7, m6-plan): every pull request and every push to develop, for now. About 4 to 5 minutes of
# runner time each; the C20 report in m6-progress6.md has the measured local time and a proposal.
name: Quick start

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Steps 2 to 4 (scripts/quickstart.sh)
        run: scripts/quickstart.sh
      - name: Steps 5 to 7 with the CLI (scripts/quickstart-smoke.sh)
        run: scripts/quickstart-smoke.sh
      - name: No image layer holds a secret (scripts/image-secret-scan.sh)
        run: scripts/image-secret-scan.sh
      - name: A live-mode start without a key refuses, with the fixed message
        run: |
          set +e
          env -u GEMINI_API_KEY AGENT_MODEL=gemini docker compose up -d --wait agent-service
          docker compose logs agent-service 2>&1 | grep -q 'AGENT_MODEL=gemini needs GEMINI_API_KEY'
      - name: Logs of the stack, if a step failed
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Step 9
        if: always()
        run: docker compose down -v
