# agent-service (C9, C10). Settings come from the environment through ServiceProperties, not from here.
spring.application.name=agent-service
spring.main.banner-mode=off
# Risk 9: no Whitelabel page, no stack trace, message or exception class in any error body. ApiErrors renders errors.
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
# Static resources only under /static (none yet), so an unknown /api route is a plain 404 from ApiErrors.
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false
server.shutdown=graceful
