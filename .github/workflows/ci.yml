# Section 15. Every push runs ./mvnw verify: build, unit, property, component,
# contract and ArchUnit tests, and the reduced scripted evaluation (ScriptedEvaluationSmokeTest:
# 20 runs per scenario at time scale 4, S9 6 and S28 2, labelled REDUCED, in eval-harness/target/eval-reduced).
# The full evaluation (-Peval-full) is manual: .github/workflows/eval-full.yml (Decision 1).
# S9 and S28 assert exit value 137 after kill -9 and start child JVMs from surefire (m4-plan risks 1 and 3);
# both held on Linux in https://github.com/pranishpushkar/UCPCheckoutAgent/actions/runs/43337144864.
# The live evaluation (-Peval-live) is manual too: .github/workflows/eval-live.yml reads GEMINI_API_KEY from a
# repository secret (m5-plan section 10). No job here has the key; NoLiveInVerifyTest keeps live calls out of verify.
name: CI

on:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify
